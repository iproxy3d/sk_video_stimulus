name: Публикация HTML-статьи

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/images/**"
      - "assets/plots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v6

      - name: Подготовить статический сайт
        shell: bash
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/.nojekyll _site/.nojekyll
          cp -R assets _site/assets

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # The artifact listing can lag behind a successful upload; deploy-pages
      # checks it immediately and may fail before the artifact becomes visible.
      - name: Дождаться доступности артефакта Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')" || count=0
            echo "Attempt ${attempt}: available github-pages artifacts = ${count}"
            if [ "${count}" = "1" ]; then
              exit 0
            fi
            if [ "${count}" -gt 1 ]; then
              echo "::error::Multiple github-pages artifacts in one run"
              exit 1
            fi
            sleep 4
          done
          echo "::error::The github-pages artifact did not become available"
          exit 1

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
