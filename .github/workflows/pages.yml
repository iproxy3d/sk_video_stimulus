name: Публикация HTML-статьи

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/images/**"
      - "assets/plots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v6

      - name: Подготовить статический сайт
        shell: bash
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/.nojekyll _site/.nojekyll
          cp -R assets _site/assets

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
