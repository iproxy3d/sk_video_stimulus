name: Публикация в PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Проверка и сборка дистрибутива
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить инструменты сборки
        run: python -m pip install --upgrade pip build twine

      - name: Установить пакет
        run: python -m pip install .

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v

      - name: Собрать wheel и исходный архив
        run: python -m build

      - name: Проверить метаданные PyPI
        run: python -m twine check dist/*

      - name: Сохранить дистрибутив
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Опубликовать дистрибутив
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sk-video-stimulus
    permissions:
      id-token: write
    steps:
      - name: Получить собранный дистрибутив
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Загрузить пакет в PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
