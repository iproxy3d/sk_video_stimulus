[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-video-stimulus"
version = "0.3.0"
description = "Извлечение низкоуровневой динамики зрительного стимула из видео"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ilya Zelenskiy"}]
keywords = ["video", "visual-stimulus", "motion-dynamics", "emotion-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
plot = ["matplotlib>=3.7"]
demo = ["Flask>=3.0"]
all = ["opencv-python>=4.8", "matplotlib>=3.7", "Flask>=3.0"]
dev = ["coverage>=7.6", "build>=1.2", "twine>=5.1", "Flask>=3.0"]

[project.scripts]
sk-video-stimulus = "sk_video_stimulus.extractor:main"
sk-video-stimulus-plot = "sk_video_stimulus.plotting:main"
sk-video-stimulus-demo = "sk_video_stimulus.dashboard:main"
sk-video-stimulus-video = "sk_video_stimulus.examples:video_main"
sk-video-stimulus-webcam = "sk_video_stimulus.examples:webcam_main"

[project.urls]
Homepage = "https://github.com/iproxy3d/sk_video_stimulus"
Repository = "https://github.com/iproxy3d/sk_video_stimulus"
Issues = "https://github.com/iproxy3d/sk_video_stimulus/issues"
Documentation = "https://github.com/iproxy3d/sk_video_stimulus/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sk_video_stimulus = ["templates/*.html"]

[tool.coverage.run]
source = ["sk_video_stimulus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
